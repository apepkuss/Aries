appId: com.aries.desktop
productName: Aries
directories:
  buildResources: resources
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources:
  - from: "../target/release/aries"
    to: "backend/aries"
  - from: "../aries-web/dist"
    to: "web-ui"
  - from: "../config.toml.example"
    to: "config.toml.example"
# For private repos, uncomment `private: true` below and ensure
# users have GH_TOKEN (with `repo` scope) set in their environment.
publish:
  provider: github
  owner: apepkuss
  repo: Aries
  # private: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: resources/icon.png
npmRebuild: false
