[package]
name        = "lantai"
version     = "0.1.0"
edition     = "2024"
description = "File-system based persistent memory with semantic search"
license     = "Apache-2.0"

[features]
default = ["openai"]
openai  = ["dep:reqwest"]

[dependencies]
thiserror   = "2.0"
serde       = { version = "1.0", features = ["derive"] }
toml        = "0.9"
tracing     = "0.1"
shellexpand = "3.1"
dirs        = "6.0"
rusqlite    = { version = "=0.32.1", features = ["bundled"] }
sqlite-vec  = "0.1.7-alpha.10"
bytemuck    = { version = "1", features = ["derive"] }
chrono      = { version = "0.4", features = ["serde"] }
sha2        = "0.10"
hex         = "0.4"
async-trait = "0.1"
tokio       = { version = "1.0", features = ["rt", "macros", "sync", "time"] }
notify      = "7"
tokio-util  = "0.7"
reqwest     = { version = "0.12", optional = true, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
