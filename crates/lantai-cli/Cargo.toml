[package]
name    = "lantai-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lantai"
path = "src/main.rs"

[dependencies]
lantai              = { path = "../lantai", features = ["openai"] }
clap                = { version = "4.5", features = ["derive", "env"] }
tokio               = { version = "1.0", features = ["full"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
anyhow              = "1.0"
tokio-util          = "0.7"
