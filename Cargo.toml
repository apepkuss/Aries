[package]
name    = "aries"
version = "0.0.1"
edition = "2024"

[lib]
name = "aries"
path = "src/lib.rs"

[[bin]]
name = "aries"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.82"
axum = { version = "^0.8", features = ["tokio", "http2", "multipart"] }
base64 = "0.22"
bitflags = "2.8.0"
bollard = { version = "0.19", features = ["ssl"] }
bytes = "1.10.1"
chat-prompts = { version = "0.35.3" }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "^4.5", features = ["cargo", "derive"] }
config = { version = "^0.15", features = ["toml"] }
dashmap = "6.1.0"
dirs = "6.0.0"
dotenv = "0.15"
endpoints = { version = "0.38.0", features = ["whisper"] }
futures-util = "0.3"
hex = "0.4.3"
http = "1.2"
humantime-serde = "1.1"
md5 = "0.7"
mime_guess = "2.0.4"
notify = "6.1"
once_cell = "1.18"
regex = "1.11.0"
reqwest = { version = "^0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "0.6.4", features = [
    "client",
    "transport-sse-client-reqwest",
    "reqwest",
    "transport-streamable-http-client-reqwest",
    "tower",
    "auth",
    "transport-child-process",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10.9"
shellexpand = "3.1"
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "runtime-tokio"] }
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7.13"
toml = { version = "0.9.11", features = ["preserve_order"] }
url = "2"
urlencoding = "2.1"
tower = { version = "^0.5", features = ["util"] }
tower-http = { version = "^0.6", features = ["trace", "cors", "request-id", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.7.0", features = ["v4"] }
zip = "7.0"
